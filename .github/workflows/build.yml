name: Build oxidation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt
      - name: Check formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path poc/matrix/Cargo.toml --check
      - name: Test plugin and live mode switching
        if: runner.os != 'Linux'
        run: cargo test --locked --package oxidation --target ${{ matrix.target }}
      - name: Test scalar and fused DSP
        if: runner.os != 'Linux'
        env:
          RUSTFLAGS: -C no-vectorize-loops -C no-vectorize-slp
        run: cargo test --locked --release --manifest-path poc/matrix/Cargo.toml --target ${{ matrix.target }}
      - name: Build CLAP and VST3 bundles
        if: runner.os != 'Linux'
        run: cargo xtask bundle oxidation --release --locked --target ${{ matrix.target }}
      - name: Build and test Linux using the documented command
        if: runner.os == 'Linux'
        run: sh scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: oxidation-${{ matrix.target }}
          path: ${{ runner.os == 'Linux' && 'target/linux/bundled/' || 'target/bundled/' }}
          if-no-files-found: error
